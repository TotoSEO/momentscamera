# Déploiement d'un APERÇU STATIQUE du site sur GitHub Pages.
#
# ⚠️ Important : GitHub Pages ne sert que des fichiers. Il n'exécute aucun
# code serveur, donc `/api/checkout` et `/api/stripe/webhook` ne peuvent pas
# y fonctionner — cette version affiche la boutique mais N'ENCAISSE AUCUN
# PAIEMENT. Pour une boutique réellement opérationnelle, déployez sur un
# hébergeur Next.js (Vercel, Netlify, Cloudflare…). Voir docs/DEPLOIEMENT.md.

name: Aperçu statique sur GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        # `static_site_generator: next` est volontairement absent : cette
        # option génère un `next.config.js` qui masquerait le
        # `next.config.ts` du dépôt. Le basePath est passé explicitement
        # à l'étape de build ci-dessous.

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Retirer les routes API
        # Un export statique ne peut pas embarquer de gestionnaire POST :
        # le build échouerait. On les écarte de cette copie de travail
        # uniquement — le dépôt n'est pas modifié.
        run: rm -rf src/app/api

      - name: Build (export statique)
        env:
          NEXT_PUBLIC_STATIC_PREVIEW: 'true'
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}${{ steps.pages.outputs.base_path }}
        run: npx --no-install next build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
