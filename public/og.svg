<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Moments Caméra — le porte-clés qui prend de vraies photos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6e9"/>
      <stop offset="55%" stop-color="#ffeccf"/>
      <stop offset="100%" stop-color="#ffe0b8"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ffd426" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffd426" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="960" cy="315" r="250" fill="url(#halo)"/>
  <circle cx="120" cy="90" r="150" fill="#2f6bff" opacity="0.18"/>
  <circle cx="180" cy="560" r="120" fill="#21d07a" opacity="0.22"/>

  <!-- Appareil -->
  <g transform="translate(860 150)">
    <circle cx="90" cy="-18" r="30" fill="none" stroke="#14121a" stroke-width="12"/>
    <rect x="70" y="6" width="40" height="26" rx="8" fill="#c02a20" stroke="#14121a" stroke-width="8"/>
    <rect x="10" y="24" width="160" height="300" rx="42" fill="#ff4438" stroke="#14121a" stroke-width="12"/>
    <path d="M40 70c0-16 13-29 29-29h18c-18 20-27 42-27 72 0 13-20 13-20 0V70Z" fill="#ffffff" opacity="0.4"/>
    <circle cx="90" cy="130" r="52" fill="#c02a20" stroke="#14121a" stroke-width="12"/>
    <circle cx="90" cy="130" r="30" fill="#14121a"/>
    <circle cx="90" cy="130" r="14" fill="#2f6bff"/>
    <circle cx="78" cy="118" r="7" fill="#ffffff" opacity="0.9"/>
    <circle cx="146" cy="206" r="10" fill="#ffd426" stroke="#14121a" stroke-width="7"/>
    <circle cx="90" cy="248" r="26" fill="#fbf8f2" stroke="#14121a" stroke-width="10"/>
  </g>

  <!-- Texte -->
  <g fill="#14121a" font-family="Fredoka, Trebuchet MS, sans-serif">
    <rect x="80" y="132" width="330" height="54" rx="27" fill="#ffffff" stroke="#14121a" stroke-width="6"/>
    <text x="112" y="169" font-size="26" font-weight="600" font-family="Space Mono, monospace">1080p · 20 g · sur vos clés</text>

    <text x="80" y="290" font-size="76" font-weight="700">Vos plus beaux</text>
    <text x="80" y="372" font-size="76" font-weight="700">moments ne sont pas</text>
    <rect x="72" y="404" width="612" height="34" rx="17" fill="#ffd426"/>
    <text x="80" y="454" font-size="76" font-weight="700">dans votre téléphone.</text>

    <rect x="80" y="500" width="300" height="70" rx="35" fill="#ff4438" stroke="#14121a" stroke-width="6"/>
    <text x="128" y="546" font-size="30" font-weight="700" fill="#ffffff">À partir de 29,90 €</text>

    <text x="412" y="546" font-size="26" fill="#4a4658" font-family="Nunito, sans-serif">momentscamera.fr</text>
  </g>
</svg>
